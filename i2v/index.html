<!DOCTYPE html>
<!-- as-is prompt-builder-video-i2v.html 에서 이식. 마크업·메타는 원본 그대로, 스타일·스크립트는 모듈 참조. -->
<html lang="ko" data-app="i2v">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 프롬프트 빌더 · 이미지에서</title>
<meta name="description" content="가지고 있는 이미지에 움직임을 넣는 영어 프롬프트를 만듭니다. 무엇이 어떻게 움직이는지에 집중합니다.">
<meta property="og:title" content="영상 프롬프트 빌더 · 이미지에서">
<meta property="og:description" content="가지고 있는 이미지에 움직임을 넣는 영어 프롬프트를 만듭니다. 무엇이 어떻게 움직이는지에 집중합니다.">
<meta property="og:type" content="website">
<!-- 파비콘도 인라인 SVG — 외부 파일을 만들지 않아 단일 HTML 성질이 유지된다.
     앱마다 강조색이 달라 탭에서 세 빌더가 색으로 구분된다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0c0f'/%3E%3Cg fill='none' stroke='%236ee7b7' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='6' width='16' height='13' rx='2.5'/%3E%3Ccircle cx='8.5' cy='10.5' r='1.4'/%3E%3Cpath d='M4.5 16.5l4-3.5 3 2.8 3-2.8 4.5 4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/shared/styles.css">
<script type="module" src="/src/shared/theme.ts"></script>
</head>
<body>
<!-- ── 아이콘 ──
     오프라인 단일 파일이라 아이콘 폰트를 쓸 수 없어 직접 그려 넣습니다.
     24×24 격자에 선 굵기 1.7 로 통일했고, 색은 currentColor 를 따릅니다.
     쓰는 쪽은 <svg class="ic"><use href="#i-이름"/></svg> 한 줄입니다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M3.5 16.5l4.5-4 3.5 3.2 3.5-3.2 5.5 5"/></symbol>
  <symbol id="i-t2v" viewBox="0 0 24 24"><path d="M3 6.5h6.5M3 11h6.5M3 15.5h4"/><rect x="12.5" y="6" width="8.5" height="12" rx="2.5"/><path d="M15.8 10.2v3.6l3.2-1.8z"/></symbol>
  <symbol id="i-i2v" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="11" height="11" rx="2.5"/><circle cx="6" cy="9.5" r="1.3"/><path d="M3 14.5l3-2.6 2.6 2.4"/><path d="M16.5 11h4.5m-2.2-2.2L21 11l-2.2 2.2"/></symbol>
  <symbol id="i-guide" viewBox="0 0 24 24"><path d="M3.5 7l1.8 1.8L8.8 5M3.5 16l1.8 1.8L8.8 14M12 7h8.5M12 16h8.5"/></symbol>
  <symbol id="i-look" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.6-8.5 4.6-8.5-4.6zM3.5 12.5l8.5 4.6 8.5-4.6"/></symbol>
  <symbol id="i-manual" viewBox="0 0 24 24"><path d="M3.5 8h8M16 8h4.5M3.5 16h3M11 16h9.5"/><circle cx="13.5" cy="8" r="2.2"/><circle cx="8.5" cy="16" r="2.2"/></symbol>
  <symbol id="i-shot" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 015.5 4H9M20 9V5.5A1.5 1.5 0 0018.5 4H15M4 15v3.5A1.5 1.5 0 005.5 20H9M20 15v3.5a1.5 1.5 0 01-1.5 1.5H15"/></symbol>
  <symbol id="i-body" viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 012-2h1.8l1.4-2.2h7.6l1.4 2.2H19a2 2 0 012 2v8.2a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="12.6" r="3.4"/></symbol>
  <symbol id="i-lens" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3.8v4.8M19.1 16.1l-4.2-2.4M4.9 16.1l4.2-2.4"/></symbol>
  <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 15.2A8.3 8.3 0 018.8 4.5a8.3 8.3 0 1010.7 10.7z"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><path d="M12 3.5c-4.7 0-8.5 3.8-8.5 8.5s3.8 8.5 8.5 8.5c1.1 0 1.8-.7 1.8-1.6 0-.5-.2-.8-.5-1.1-.3-.3-.5-.6-.5-1.1 0-.9.7-1.6 1.6-1.6h1.9c3 0 5.2-2.2 5.2-5.2 0-3.9-3.8-6.4-9.5-6.4z"/><circle cx="7.8" cy="11.5" r="1.1"/><circle cx="11.2" cy="8" r="1.1"/><circle cx="15.6" cy="9.6" r="1.1"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M3.5 12h12m-3.5-4l4 4-4 4M20.5 6v12"/></symbol>
  <symbol id="i-tech" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.2v2.4M12 18.4v2.4M4.4 7.6l2.1 1.2M17.5 15.2l2.1 1.2M4.4 16.4l2.1-1.2M17.5 8.8l2.1-1.2"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4.5 9.5h10.8a4.7 4.7 0 010 9.4H9M8.5 5.5l-4 4 4 4"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5v-2h5v2M6.2 6.5l.9 12.2a1.5 1.5 0 001.5 1.4h6.8a1.5 1.5 0 001.5-1.4l.9-12.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M5.5 15H5a1.5 1.5 0 01-1.5-1.5v-9A1.5 1.5 0 015 3h9a1.5 1.5 0 011.5 1.5V5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-subject" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h11M4 17.5h7"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.2 12S5.9 5.8 12 5.8 21.8 12 21.8 12 18.1 18.2 12 18.2 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="2.9"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.6 5.9A10.5 10.5 0 0112 5.8c6.1 0 9.8 6.2 9.8 6.2a18 18 0 01-3 3.7M5.5 7.7A17.6 17.6 0 002.2 12S5.9 18.2 12 18.2c1.6 0 3-.4 4.2-1M3.5 3.5l17 17"/></symbol>
  <symbol id="i-no-text" viewBox="0 0 24 24"><path d="M5.5 7V5h13v2M12 5v14M9.2 19h5.6M3.5 3.5l17 17"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></symbol>
</defs></svg>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand-ic" aria-hidden="true"><use href="#i-image" id="brandUse"/></svg>
      <div class="brand-tx">
        <h1 id="appTitle" aria-current="page"><button class="brand-btn" id="builderBtn"
            aria-haspopup="true" aria-expanded="false" aria-controls="builderMenu"
            title="다른 빌더로 전환"><span id="appTitleText"></span><svg class="ic caret"
            aria-hidden="true"><use href="#i-caret"/></svg></button></h1>
        <div class="builder-menu" id="builderMenu" role="menu" aria-label="프롬프트 빌더 선택"></div>
      </div>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="화면 테마">
        <button class="theme-option" id="themeLight" data-theme-choice="light" aria-pressed="false"
                title="라이트 테마" aria-label="라이트 테마"><svg class="ic" aria-hidden="true"><use href="#i-light"/></svg></button>
        <button class="theme-option" id="themeDark" data-theme-choice="dark" aria-pressed="true"
                title="다크 테마" aria-label="다크 테마"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
      </div>
    </div>
    <div class="modetabs" role="tablist" aria-label="선택 방법">
    <button class="modetab on" data-pane="look" role="tab" aria-selected="true"
            aria-controls="pane-look" id="tab-look"><svg class="ic" aria-hidden="true"><use href="#i-look"/></svg>
      <span class="modetab-tx"><span id="lookTabName">레퍼런스 룩</span> <small id="lookTabSub"></small></span></button>
    <button class="modetab" data-pane="guide" role="tab" aria-selected="false"
            aria-controls="pane-guide" id="tab-guide"><svg class="ic" aria-hidden="true"><use href="#i-guide"/></svg>
      <span class="modetab-tx">가이드 <small id="guideTabSub"></small></span></button>
    <button class="modetab" data-pane="manual" role="tab" aria-selected="false"
            aria-controls="pane-manual" id="tab-manual"><svg class="ic" aria-hidden="true"><use href="#i-manual"/></svg>
      <span class="modetab-tx">직접 선택 <small>항목별 세부 조정</small></span></button>
    </div>
  </header>

  <div class="pane on" id="pane-look" role="tabpanel" aria-labelledby="tab-look">
    <div class="wiz">
      <div class="wiz-q"><b>①</b><span id="lookHeading"></span></div>
      <div class="preset-row" id="presets"></div>
      <div class="wiz-note" id="lookNote"></div>
    </div>
  </div>

  <div class="pane" id="pane-guide" role="tabpanel" aria-labelledby="tab-guide"><div class="wiz" id="wiz"></div></div>

  <div class="pane" id="pane-manual" role="tabpanel" aria-labelledby="tab-manual">
    <div class="toolbar">
      <input id="search" aria-label="항목 검색" placeholder="🔍 항목 검색 (예: 85mm, 골든아워, 보케)">
      <div class="switch" role="group" aria-label="표시 수준">
        <button id="m-easy" class="on" data-level="easy" aria-pressed="true"
                title="자주 쓰는 핵심 항목만 보여줍니다">초보</button>
        <button id="m-all" data-level="all" aria-pressed="false"
                title="촬영장에서 실제로 통제하는 모든 항목을 보여줍니다">전문가</button>
      </div>
    </div>
    <div id="sections"></div>
  </div>
</div>

<div class="out" id="outRail">
  <button class="mobile-out-bar" id="mobileOutBar" aria-expanded="false" aria-controls="outPanel">
    <span class="mobile-out-copy"><b>생성 결과</b><small id="mobileOutSum">선택 결과가 여기에 표시됩니다.</small></span>
    <svg class="ic" aria-hidden="true"><use href="#i-caret"/></svg>
  </button>
  <button class="mobile-out-head" id="mobileOutHead" aria-label="생성 결과 패널 최소화">
    <span class="mobile-out-title"><b>생성 결과</b><small id="mobileOutHeadSum"></small></span>
    <svg class="ic" aria-hidden="true"><use href="#i-caret"/></svg>
  </button>
  <div class="out-in" id="outPanel">
    <!-- 1. 대상 모델 — 이후 모든 항목의 의미를 바꾸므로 맨 위에 둔다 -->
    <div class="model-box" id="modelBox">
      <span class="profile-label">대상 모델</span>
      <div class="seg model-switch" id="modelSwitch" role="group" aria-label="대상 모델"></div>
      <div class="mode-help" id="modeHelp"></div>
    </div>

    <!-- 2. 입력 (3. Seedance 설정 패널은 엔진이 이 뒤에 끼워 넣는다) -->
    <div class="subject-box">
      <span class="field-lab" id="subjectFieldLabel" aria-hidden="true"><svg class="ic"
        aria-hidden="true"><use href="#i-subject"/></svg><span id="subjectFieldText"></span></span>
      <span class="note" id="subjectNote" role="status" aria-live="polite"></span>
      <input id="subject" aria-label="피사체 · 장면 입력" autofocus>
    </div>

    <div class="scope" id="scope" role="group" aria-label="출력 범위"></div>

    <div class="selsum-box" id="selSumBox">
      <button class="selsum-head" id="selSumHead" aria-expanded="false" aria-controls="selSummary">
        <span class="arrow" aria-hidden="true">▶</span>
        <svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span class="selsum-t">현재 선택</span>
        <span class="selsum-n" id="selSumCount"></span>
      </button>
      <div class="selsum" id="selSummary" role="group" aria-label="현재 선택한 항목"></div>
    </div>
    <!-- 6. 생성된 프롬프트 — 출력 밀도는 결과의 성질이라 제목 옆에 붙인다 -->
    <div class="out-top">
      <div class="out-lab" id="outLab"></div>
    </div>
    <textarea id="prompt" aria-label="생성된 프롬프트"
              placeholder="왼쪽에서 항목을 고르면 여기에 프롬프트가 만들어집니다." readonly></textarea>

    <!-- 7. 동작 버튼 — 레일을 스크롤해도 복사가 손에 닿는 곳에 남아야 한다 -->
    <div class="out-actions" id="outActions">
      <div class="out-actions-row">
        <button class="act" id="undoBtn" data-act="undo" disabled aria-label="되돌리기"
                ><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg><span id="undoCount">0/0</span></button>
        <button class="act" id="resetBtn" data-act="reset"
                title="선택·입력을 모두 비웁니다 (되돌리기로 복구 가능)"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg>초기화</button>
      </div>
      <div class="out-actions-row">
        <div class="seg len-switch" role="group" aria-label="출력 밀도">
          <button class="on" data-length="short">간결</button>
          <button data-length="detail">상세</button>
        </div>
        <button class="act copy" id="copyBtn" data-act="copy" disabled
                title="프롬프트를 클립보드로 복사 (⌘/Ctrl + Enter)"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg><span class="copy-tx">복사</span></button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/apps/i2v/main.ts"></script>
</body>
</html>
