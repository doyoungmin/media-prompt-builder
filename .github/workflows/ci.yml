# PR·push마다 타입 검사·빌드·CSS·런타임 회귀를 확인한다.
# 배포는 Cloudflare Workers(wrangler.jsonc)에 별도로 수행하므로 여기서는 하지 않는다.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # jsdom 30 이 요구하는 하한(^22.22.2)에 맞춘다. 20 에서는 jsdom 이 끌어오는
        # undici 가 markAsUncloneable 을 못 찾아 스모크 테스트가 통째로 죽는다.
        # package.json 의 engines 와 같이 움직여야 한다.
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint:css
      - run: npm run test:smoke
      - run: npm run verify:storage
      - run: npm run verify:copy
      - run: npm run verify:pwa
      - run: npm run verify:seedance
      # 실제 브라우저 검증 — jsdom 은 레이아웃을 계산하지 않고 ESM 번들도 못 돌린다.
      # 빌드된 결과가 정말 뜨는지와 폭별 레이아웃은 여기서만 확인된다.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
